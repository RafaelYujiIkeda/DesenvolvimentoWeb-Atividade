<div *ngIf="produto">

    <h1>Detalhe do Produto</h1>

    <div class="card">
        <div class="card-body">

            Código do Produto: {{produto.codigo}}<br>
            Nome do produto: {{produto.nome}}<br>
            Valor: R$ {{produto.valor}}<br>
            Valor em Promoção: R$ {{produto.valorPromo}}<br>
            Descrição: {{produto.descritivo}}<br>
            Quantidade: {{produto.quantidade}}<br>
            Destaque: {{produto.destaque}}<br>

        </div>
    </div>

</div>
